name: Build & Upload Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      asset_tag: ${{ steps.tag.outputs.asset }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_TAG" ]] || { echo "release tag is empty" >&2; exit 1; }
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset=${RELEASE_TAG//\//-}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Verify tag and release structure
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          ./script/release-smoke.sh

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Verify release tag checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$tag_commit" ]] || {
            echo "HEAD $head_commit does not match $RELEASE_TAG ($tag_commit)" >&2
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build main program
        shell: pwsh
        run: cmd /c script\build-win.bat

      - name: Build supported plugins
        shell: bash
        run: ./script/build-plugins.sh windows amd64 build/windows/plugins

      - name: Package
        shell: pwsh
        env:
          ASSET_TAG: ${{ needs.prepare.outputs.asset_tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/xiaohei-$($env:ASSET_TAG)-windows-amd64.zip"
          Push-Location build\windows
          $destination = Join-Path (Resolve-Path ../..).Path $archive
          Compress-Archive -Path server.exe, static, plugins -DestinationPath $destination -Force
          Pop-Location

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $name = Split-Path $archive -Leaf
          "$hash  $name" | Set-Content "$archive.sha256" -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          retention-days: 1

  build-unix:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            label: Linux
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Verify release tag checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$tag_commit" ]] || {
            echo "HEAD $head_commit does not match $RELEASE_TAG ($tag_commit)" >&2
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build main program
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
        run: |
          set -euo pipefail
          output_dir="build/$TARGET_OS"
          mkdir -p "$output_dir/static" "$output_dir/plugins"
          cp -a frontend/dist/. "$output_dir/static/"
          (
            cd backend
            CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH=amd64 \
              go build -buildvcs=false -trimpath -o "../$output_dir/server" ./cmd/server
          )

      - name: Build supported plugins
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
        run: ./script/build-plugins.sh "$TARGET_OS" amd64 "build/$TARGET_OS/plugins"

      - name: Package
        shell: bash
        env:
          ASSET_TAG: ${{ needs.prepare.outputs.asset_tag }}
          TARGET_OS: ${{ matrix.goos }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/xiaohei-$ASSET_TAG-$TARGET_OS-amd64.tar.gz"
          tar -C "build/$TARGET_OS" -czf "$archive" server static plugins
          sha256sum "$archive" | sed "s#  dist/#  #" > "$archive.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-release
          path: dist/*
          retention-days: 1

  release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: [prepare, smoke, build-windows, build-unix]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
