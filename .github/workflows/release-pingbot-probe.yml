name: Build Pingbot Probe

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      asset_tag: ${{ steps.tag.outputs.asset }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_TAG" ]] || { echo "release tag is empty" >&2; exit 1; }
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset=${RELEASE_TAG//\//-}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - target: linux-arm64
            goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - target: windows-amd64
            goos: windows
            goarch: amd64
            archive_ext: zip

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Verify release tag checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$tag_commit" ]] || {
            echo "HEAD $head_commit does not match $RELEASE_TAG ($tag_commit)" >&2
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pingbot/go.mod
          cache-dependency-path: pingbot/go.sum

      - name: Build and package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ASSET_TAG: ${{ needs.prepare.outputs.asset_tag }}
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail

          package_name="pingbot-$ASSET_TAG-$TARGET"
          package_dir="pkg/$package_name"
          archive="dist/$package_name.$ARCHIVE_EXT"
          mkdir -p "$package_dir" dist

          binary="pingbot"
          [[ "$TARGET_OS" == "windows" ]] && binary="pingbot.exe"
          (
            cd pingbot
            CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
              go build -buildvcs=false -trimpath -ldflags="-s -w" -o "../$package_dir/$binary" ./cmd/pingbot
          )

          cp pingbot/deploy/windows/pingbot-example.yaml "$package_dir/config.example.yaml"
          if [[ "$TARGET_OS" == "linux" ]]; then
            cp pingbot/deploy/systemd/pingbot.service "$package_dir/"
            cp pingbot/deploy/systemd/install.sh "$package_dir/"
            cp pingbot/deploy/systemd/uninstall.sh "$package_dir/"
            chmod +x "$package_dir/pingbot" "$package_dir/install.sh" "$package_dir/uninstall.sh"
            tar -C pkg -czf "$archive" "$package_name"
            tar -tzf "$archive" | grep -Fx "$package_name/install.sh" >/dev/null
          else
            cp pingbot/deploy/windows/install-nssm.ps1 "$package_dir/"
            cp pingbot/deploy/windows/uninstall-nssm.ps1 "$package_dir/"
            (
              cd pkg
              zip -qr "../$archive" "$package_name"
            )
            unzip -Z1 "$archive" | grep -Fx "$package_name/pingbot.exe" >/dev/null
          fi

          sha256sum "$archive" | sed 's#  dist/#  #' > "$archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingbot-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pingbot-*
          path: dist
          merge-multiple: true

      - name: Ensure release exists and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Pingbot probe release $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
