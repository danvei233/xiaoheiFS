name: Build xiaoheifs_userapp

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      update_server_url:
        description: 'Update manifest server base URL (https://...) used at build time via --dart-define. Defaults to the repository variable UPDATE_SERVER_URL.'
        required: false
        type: string
      default_api_url:
        description: 'Default API base URL (https://...) used at build time via --dart-define. Defaults to the repository variable DEFAULT_API_URL.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Android (xiaoheifs_userapp)
    runs-on: ubuntu-latest
    # Uploading release assets requires contents: write; everything else only reads.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app/xiaoheifs_userapp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.pub-cache
            C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/xiaoheifs_userapp/pubspec.lock') }}

      - name: Cache Gradle
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/xiaoheifs_userapp/android/gradle/wrapper/gradle-wrapper.properties', 'app/xiaoheifs_userapp/android/build.gradle', 'app/xiaoheifs_userapp/android/settings.gradle.kts') }}

      - name: Pub get
        run: flutter pub get

      - name: Provision release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${ANDROID_RELEASE_KEYSTORE_PATH:-${RUNNER_TEMP}/android-release-keystore.jks}"
          if [ -n "${ANDROID_RELEASE_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::release keystore is not available on this runner (set ANDROID_RELEASE_KEYSTORE_B64 or pre-provision ANDROID_RELEASE_KEYSTORE_PATH); refusing to sign with the debug keystore"
            exit 1
          fi
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PATH }}
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}

      - name: Resolve build-time dart-defines
        shell: bash
        run: |
          set -euo pipefail
          DART_DEFINES=""
          IS_RELEASE="${{ github.event_name == 'release' && '1' || '0' }}"
          UPDATE_SERVER_URL="${{ inputs.update_server_url || vars.UPDATE_SERVER_URL || '' }}"
          DEFAULT_API_URL="${{ inputs.default_api_url || vars.DEFAULT_API_URL || '' }}"
          UPDATE_SIGN_PUBLIC_KEY="${{ secrets.UPDATE_SIGN_PUBLIC_KEY || '' }}"
          if [ -n "$UPDATE_SERVER_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=UPDATE_SERVER_URL=$UPDATE_SERVER_URL"
          elif [ "$IS_RELEASE" = "1" ]; then
            echo "::error::UPDATE_SERVER_URL is required for a release build; a placeholder domain would ship a dead signed-update channel"
            exit 1
          else
            echo "::warning::UPDATE_SERVER_URL is not configured; the build will use the placeholder domain and the signed-update channel will fail closed"
          fi
          if [ -n "$DEFAULT_API_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=DEFAULT_API_URL=$DEFAULT_API_URL"
          else
            echo "::warning::DEFAULT_API_URL is not configured; the build will use the placeholder API domain"
          fi
          if [ -n "$UPDATE_SIGN_PUBLIC_KEY" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=UPDATE_SIGN_PUBLIC_KEY=$UPDATE_SIGN_PUBLIC_KEY"
          elif [ "$IS_RELEASE" = "1" ]; then
            echo "::error::UPDATE_SIGN_PUBLIC_KEY is required for a release build; a placeholder public key rejects all updates"
            exit 1
          else
            echo "::warning::UPDATE_SIGN_PUBLIC_KEY is not configured; the build will embed the placeholder public key and reject all updates (fail closed)"
          fi
          echo "DART_DEFINES=$DART_DEFINES" >> "$GITHUB_ENV"

      - name: Build APK (release)
        run: flutter build apk --release $DART_DEFINES
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ env.ANDROID_RELEASE_KEYSTORE_PATH }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaoheifs_userapp-android-apk
          path: app/xiaoheifs_userapp/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: app/xiaoheifs_userapp/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows (xiaoheifs_userapp)
    runs-on: windows-latest
    # Uploading release assets requires contents: write; everything else only reads.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app/xiaoheifs_userapp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.pub-cache
            C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/xiaoheifs_userapp/pubspec.lock') }}

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package Windows build
        run: |
          $releaseDir = Get-ChildItem -Path "build/windows" -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match "runner[\\\\/]Release$" } |
            Select-Object -First 1
          if (-not $releaseDir) { throw "Windows Release directory not found under build/windows/**/runner/Release" }
          $out = $releaseDir.FullName
          $zip = "xiaoheifs_userapp-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiaoheifs_userapp-windows
          path: app/xiaoheifs_userapp/xiaoheifs_userapp-windows.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: app/xiaoheifs_userapp/xiaoheifs_userapp-windows.zip
