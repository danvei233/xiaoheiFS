        - Console
      summary: 跳转到 VPS 面板
      description: |-
        校验面板密码后签发短时单次 ticket，302 重定向到
        `control/ecs/login?ticket=<ticket>`。重定向 Location **绝不含**
        panel_password/host_name（防长期密码进入浏览器历史/Referer/代理日志）。
        该端点与其它端点一样要求 apikey（A1 作用域，`panel`/`read`/`all`），
        面板密码只是第二重凭据。
        目标登录端点 `control/ecs/login` 必须在另一请求用
        `TicketService::consumeTicket(ticket, 'panel')` 换取会话并服务端注入
        凭据（见 `/control/ecs/login` 契约；表结构见 `qz-override/db/panel_ticket.sql`）。
      operationId: panelRedirect
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                host_name:
                  type: string
                  description: VPS 主机名
                panel_password:
                  type: string
                  description: 面板密码
      responses:
        '302':
          description: 重定向到 VPS 管理面板（仅携带 ticket）
          headers:
            Location:
              description: '跳转目标 URL：`<control/ecs/login>?ticket=<ticket>`'
              schema:
                type: string
        '200':
          description: 校验失败（JSON 错误）
