  /vnc_view:
    post:
      tags:
        - Console
      summary: 获取 VNC 访问地址
      description: |-
        签发短时单次 VNC ticket，返回 JSON `{ticket, consume_url}`。**不再**返回
        302 且绝不把 vnc_password 放进重定向 URL/query。客户端打开同源
        `consume_url`（`control/ecs/vnc?ticket=<ticket>`，见 `/control/ecs/vnc`
        契约），由服务端在另一请求用 `TicketService::consumeTicket(ticket,
        'vnc')` 换取 VNC 会话并注入密码。要求 apikey（`host_control`/`read`/
        `all` 作用域）。
      operationId: vncView
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                host_id:
                  type: integer
                  description: VPS 的 ID
      responses:
        '200':
          description: 返回单次 ticket 与同源 consume_url
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseBase'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - ticket
                          - consume_url
                        properties:
                          ticket:
                            type: string
                            description: 短时单次 VNC ticket
                          consume_url:
                            type: string
                            description: 同源 ticket 消费端点（HTTPS/本机）
  /control/ecs/login:
    get:
      tags:
        - Console
      summary: 消费面板 ticket 并建立面板会话
      description: |-
        **生产 consume 路由**（浏览器随 `/panel` 302 到达）。消费短时单次 panel
        ticket（`TicketService::consumeTicket(ticket, 'panel')`：kind/expiry/单次/
        绑定全部校验，`used 0→1` 原子、并发单赢家），然后服务端用宿主
        `panel_password` 渲染**自动提交登录表单**——密码只出现在 POST body，
        绝不进入 URL/query/日志/Referer/浏览器历史。ticket 无效/已用/过期/
        绑定不符一律 fail-closed。不要求 apikey：ticket 即携带者凭据。
      operationId: panelLoginConsume
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            description: /panel 签发的单次 ticket
      responses:
        '200':
          description: 自动提交登录表单（no-store；表单载荷含一次性面板密码）或 JSON 错误
        '400':
          description: 缺少/无效/已用/过期 ticket（JSON {code:0, msg}）
  /control/ecs/vnc:
    get:
      tags:
        - Console
      summary: 消费 VNC ticket 并建立 VNC 会话
      description: |-
        **生产 consume 路由**（客户端打开 `/vnc_view` 返回的同源 consume_url）。
        消费短时单次 vnc ticket（`TicketService::consumeTicket(ticket, 'vnc')`），
        然后服务端用宿主 `vnc_password` 渲染**自动提交登录表单**——密码只出现在
        POST body，绝不进入 URL/query/日志。ticket 无效/已用/过期/绑定不符一律
        fail-closed。不要求 apikey：ticket 即携带者凭据。
      operationId: vncLoginConsume
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            description: /vnc_view 签发的单次 ticket
      responses:
        '200':
          description: 自动提交登录表单（no-store）或 JSON 错误
        '400':
          description: 缺少/无效/已用/过期 ticket（JSON {code:0, msg}）
