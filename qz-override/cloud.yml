  /renew:
    post:
      tags:
        - Order
      summary: 续订 VPS 服务
      description: |-
        续订 VPS 服务。F2：`nextduedate` 必须是未来且不晚于
        now + `web.cloud_max_extend_days`（默认 730 天）的合法日期，否则拒绝
        （防止免续费无限延长）。P2-11：仅凭 `order` 作用域 + 未来时间窗不能
        免费续期——必须携带与该主机和当前租户绑定的「已支付订单」授权
        `order_id`（order_auth 表，支付集成在支付成功后写入）；授权被原子
        单次消费（重放/越权/过期/并发竞争失败一律拒绝）后才会写入新
        end_time，且消费与 end_time 变更在同一事务内（失败不改 end_time）。
        要求 apikey（`order`/`all` 作用域）与主机所有权。
      operationId: renewHost
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                host_id:
                  type: integer
                  description: VPS 的 ID
                nextduedate:
                  type: string
                  format: date-time
                  description: 下次到期时间（必须为未来且不超过最大可续窗口）
                order_id:
                  type: string
                  description: 已支付订单授权号（P2-11 必填；单次消费、绑定主机与租户）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'
              example:
                code: 1
                msg: "succ"
                data: ""
