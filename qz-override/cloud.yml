openapi: '3.0.3'
info:
  title: Cloud VPS API
  description: |-
    提供 VPS 产品、线路、实例与安全相关能力的 OpenAPI 文档。
  version: '1.0.0'
servers:
  - url: https://cloud.example.com
    description: 示例地址，请替换为实际环境
tags:
  - name: Test
    description: 测试与连通性
  - name: Catalog
    description: 产品与线路
  - name: Host
    description: VPS 实例与基础信息
  - name: HostAction
    description: VPS 操作与状态管理
  - name: Backup
    description: 备份管理
  - name: Snapshot
    description: 快照管理
  - name: Security
    description: 安全与 ACL 管理
  - name: Port
    description: 端口映射管理
  - name: Console
    description: 控制台与监控
  - name: Order
    description: 开通、续费与升级
components:
  schemas:
    ApiResponseBase:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          description: 响应状态码（1 表示成功）
        msg:
          type: string
          description: 响应消息
    ApiResponseString:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: string
              description: 返回数据，通常为空字符串
    ApiResponseObject:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: 返回数据，结构视实现而定
              additionalProperties: true
    ApiResponseArray:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              description: 返回数据列表
              items:
                type: object
                additionalProperties: true
    ProductListData:
      type: object
      description: 按产品ID索引的产品对象集合
      additionalProperties:
        type: object
        required:
          - id
          - product_name
          - host_cpu
          - host_ram
          - host_data
          - bandwidth
        properties:
          id:
            type: integer
            description: 产品ID
            example: 1
          product_name:
            type: string
            description: 产品名称
            example: "8c16g 100m"
          host_cpu:
            type: integer
            description: CPU 核心数
            example: 8
          host_ram:
            type: integer
            description: 内存大小（GB）
            example: 16
          host_data:
            type: integer
            description: 硬盘大小（GB）
            example: 40
          bandwidth:
            type: integer
            description: 带宽（Mbps）
            example: 25
          snapshot_num:
            type: integer
            description: 快照数量
            example: 1
          backup_num:
            type: integer
            description: 备份数量
            example: 0
          nat_port_num:
            type: integer
            description: NAT 端口数量
            example: 30
          price:
            type: string
            description: 价格
            example: "0.00"
          sort:
            type: integer
            description: 排序值
            example: 0
          nat_domain_num:
            type: integer
            description: 域名数量
            example: 0
          gpu_resolution:
            type: integer
            description: GPU 分辨率
            example: 0
          gpu_capacity:
            type: integer
            description: GPU 容量
            example: 0
          category:
            type: integer
            description: 分类标识
            example: 0
          isshow:
            type: integer
            description: 是否展示
            example: 1
          metal:
            type: integer
            description: 金属标识
            example: 0
          is_nat:
            type: integer
            description: 是否支持 NAT
            example: 1
          traffic:
            type: integer
            description: 流量
            example: 0
          ipnum:
            type: integer
            description: IP 数量
            example: 0
          remark:
            type: string
            description: 备注
            example: ""
          create_time:
            type: string
            format: date-time
            description: 创建时间
            example: "2024-05-26 16:41:56"
          update_time:
            type: string
            format: date-time
            description: 更新时间
            example: "2025-06-19 02:54:52"
          is_delete:
            type: integer
            description: 删除标识
            example: 0
    LineListData:
      type: array
      description: 线路列表
      items:
        type: object
        required:
          - id
          - line_name
          - third_line_id
          - line_type
          - area_id
          - state
          - snapshot_num
          - backup_num
          - reinstall_num
          - is_nat
          - port_num
          - domain_num
          - create_time
          - update_time
        properties:
          id:
            type: integer
            description: 线路ID
            example: 1
          line_name:
            type: string
            description: 线路名称
            example: "R620-2667v2"
          third_line_id:
            type: integer
            description: 第三方线路ID
            example: 0
          line_type:
            type: integer
            description: 线路类型
            example: 1
          line_api:
            type: string
            description: 线路 API 地址(无用)
            example: ""
          area_id:
            type: integer
            description: 区域 ID
            example: 1
          remark:
            type: string
            description: 备注
            example: ""
          state:
            type: integer
            description: 状态（1 表示可用）
            example: 1
          snapshot_num:
            type: integer
            description: 快照数量
            example: 1
          backup_num:
            type: integer
            description: 备份数量
            example: 3
          reinstall_num:
            type: integer
            description: 重装次数限制
            example: 5
          is_nat:
            type: integer
            description: 是否支持 NAT
            example: 1
          port_num:
            type: integer
            description: 端口数量
            example: 20
          domain_num:
            type: integer
            description: 域名数量
            example: 0
          create_time:
            type: string
            format: date-time
            description: 创建时间
            example: "2024-05-24 23:34:07"
          update_time:
            type: string
            format: date-time
            description: 更新时间
            example: "2025-01-29 00:20:23"
    HostListData:
      type: array
      description: VPS 列表
      items:
        type: object
        properties:
          id:
            type: integer
          host_name:
            type: string
          ip:
            type: string
          remark:
            type: string
    HostInfoData:
      type: object
      description: VPS 主机详细信息
      properties:
        id:
          type: integer
          description: VPS 唯一标识
        user_id:
          type: integer
          description: 用户 ID
        orderid:
          type: integer
          description: 订单 ID
        product_name:
          type: string
          nullable: true
          description: 产品名称
        product_id:
          type: integer
          description: 产品 ID
        area_id:
          type: integer
          description: 区域 ID
        area_name:
          type: string
          description: 区域名称
        line_name:
          type: string
          description: 线路名称
        line_id:
          type: integer
          description: 线路 ID
        node_name:
          type: string
          description: 节点名称
        node_id:
          type: integer
          description: 节点 ID
        host_name:
          type: string
          description: VPS 主机名
        cpu:
          type: integer
          description: CPU 核数
        cpu_model:
          type: string
          nullable: true
          description: CPU 型号
        ip:
          type: string
          description: 公网 IP
        local_ip:
          type: string
          description: 内网 IP
        vnc_port:
          type: string
          nullable: true
          description: VNC 端口
        vnc_password:
          type: string
          description: >-
            【已脱敏】VNC 密码。普通 hostinfo 不再返回节点秘密，请改用
            hostinfo_credentials（需 credentials 作用域）。
        virtual_type:
          type: string
          description: 虚拟化类型
        from_type:
          type: string
          description: 来源类型
        plug_name:
          type: string
          description: 插件名称
        buy_time:
          type: string
          format: date
          description: 购买时间
        end_time:
          type: string
          format: date
          description: 到期时间
        memory:
          type: integer
          description: 内存大小 (GB)
        hard_disks:
          type: integer
          description: 硬盘大小 (GB)
        bandwidth:
          type: integer
          description: 带宽 (Mbps)
        os_name:
          type: string
          description: 操作系统名称
        os_password:
          type: string
          description: >-
            【已脱敏】操作系统密码。普通 hostinfo 不再返回节点秘密，请改用
            hostinfo_credentials（需 credentials 作用域）。
        panel_password:
          type: string
          description: >-
            【已脱敏】面板密码。普通 hostinfo 不再返回节点秘密，请改用
            hostinfo_credentials（需 credentials 作用域）。
        cpu_limit:
          type: integer
          description: CPU 限制 (%)
        ram_start:
          type: integer
          description: 内存起始值 (MB)
        memory_dynamic:
          type: integer
          description: 内存动态调整
        state:
          type: integer
          description: VPS 状态
        add_ip:
          type: string
          nullable: true
          description: 额外 IP
        is_agent:
          type: integer
          description: 是否代理
        os_disk_path:
          type: string
          description: 系统盘路径
        os_disk_maxiops:
          type: string
          description: 系统盘最大 IOPS
        data_disk_path:
          type: string
          description: 数据盘路径
        data_disk_maxiops:
          type: integer
          description: 数据盘最大 IOPS
        now_iso:
          type: string
          nullable: true
          description: 当前加载 ISO
        sync_time:
          type: integer
          description: 同步时间间隔 (秒)
        is_nat:
          type: integer
          description: 是否 NAT 模式
        port_num:
          type: integer
          description: 端口数量
        os_read:
          type: string
          description: 系统盘读取限速
        os_write:
          type: string
          description: 系统盘写入限速
        data_read:
          type: string
          description: 数据盘读取限速
        data_write:
          type: string
          description: 数据盘写入限速
        domain_num:
          type: integer
          description: 域名数量
        snapshot_num:
          type: integer
          description: 快照数量
        backup_num:
          type: integer
          description: 备份数量
        reinstall_time:
          type: string
          nullable: true
          description: 上次重装时间
        reinstall_num:
          type: integer
          description: 重装次数
        max_reinstall_num:
          type: integer
          description: 最大重装次数
        firewall_enable:
          type: integer
          description: 防火墙是否启用
        resolution:
          type: integer
          description: 分辨率
        gpu_capacity:
          type: integer
          description: GPU 容量
        open_gpu:
          type: integer
          description: 是否启用 GPU
        metal:
          type: integer
          description: 物理机标识
        traffic:
          type: integer
          description: 流量计数
        close_network:
          type: string
          description: 网络关闭标识
        bios:
          type: string
          description: BIOS 类型
        parent_id:
          type: integer
          nullable: true
          description: 父级 VPS ID
        vlanid1:
          type: integer
          description: VLAN ID1
        vlanid2:
          type: integer
          description: VLAN ID2
        remark:
          type: string
          description: 备注
        other_info:
          type: string
          description: 其他信息
        create_time:
          type: string
          format: date-time
          description: 创建时间
        update_time:
          type: string
          format: date-time
          description: 更新时间
        is_delete:
          type: integer
          description: 删除标志
        bandwidth_in:
          type: integer
          description: 入站带宽 (Mbps)
        is_vnc:
          type: integer
          description: 是否启用 VNC
        os_size:
          type: string
          nullable: true
          description: 系统盘大小
        network:
          type: object
          description: 网络接口信息，键为接口名
          additionalProperties:
            type: array
            description: 接口列表
            items:
              type: object
              properties:
                id:
                  type: integer
                  description: 网络记录唯一标识
                ip:
                  type: string
                  description: IP 地址
                netmask:
                  type: string
                  description: 子网掩码
                gateway:
                  type: string
                  description: 网关
                mac:
                  type: string
                  description: MAC 地址
                v_name:
                  type: string
                  description: 虚拟机名
                remark:
                  type: string
                  description: 备注
                state:
                  type: integer
                  description: 状态
                v_name_type:
                  type: string
                  description: 虚拟机名称类型
                create_time:
                  type: string
                  format: date-time
                  description: 创建时间
                update_time:
                  type: string
                  format: date-time
                  description: 更新时间
                public_ip:
                  type: string
                  description: 公网 IP 地址
                ip_pool_name:
                  type: string
                  description: IP 池名称
                ip_pool_id:
                  type: integer
                  description: IP 池 ID
              additionalProperties: true
        remote_ip:
          type: string
          description: 远程访问地址，包括端口
    ImageListData:
      type: array
      description: 镜像列表
      items:
        type: object
        properties:
          id:
            type: integer
            description: 镜像 ID
          name:
            type: string
            description: 镜像名称
          type:
            type: string
            description: 镜像类型
          desc:
            type: string
            description: 镜像描述
    NatAclListData:
      type: array
      description: NAT 转发规则列表
      items:
        type: object
        properties:
          id:
            type: integer
            description: 转发规则 ID
          host_id:
            type: integer
            description: 所属 VPS ID
          host_name:
            type: string
            description: VPS 主机名
          name:
            type: string
            description: 转发规则名称
          port_type:
            type: string
            description: 端口类型
          sport:
            type: string
            description: 源端口
          dport:
            type: string
            description: 目标端口
          api_url:
            type: string
            description: 公网访问地址
          sys:
            type: integer
            description: 系统标识（1=系统转发，2=用户自定义）
          dip:
            type: string
            description: 内网目标 IP
    MonitorData:
      type: object
      description: 监控数据
      properties:
        StorageStats:
          type: integer
          description: 存储统计
        NetworkStats:
          type: object
          description: 网络统计
          properties:
            BytesSentPersec:
              type: integer
              description: 每秒发送字节数
            BytesReceivedPersec:
              type: integer
              description: 每秒接收字节数
          required:
            - BytesSentPersec
            - BytesReceivedPersec
        CpuStats:
          type: integer
          description: CPU 使用率 (%)
        MemoryStats:
          type: integer
          description: 内存使用率 (%)
        Traffic:
          type: object
          description: 流量统计
          properties:
            TrafficOut:
              type: integer
              description: 流出流量
            TrafficIn:
              type: integer
              description: 流入流量
          required:
            - TrafficOut
            - TrafficIn
      required:
        - StorageStats
        - NetworkStats
        - CpuStats
        - MemoryStats
        - Traffic
    OperationResultData:
      type: object
      description: 操作结果
      properties:
        code:
          type: integer
          description: 内部状态码，200 表示成功
        msg:
          type: string
          description: 内部响应消息
    BackupCreateResultData:
      type: object
      description: 备份任务执行结果
      properties:
        code:
          type: integer
          description: 内部状态码，200 表示成功
        msg:
          type: string
          description: 内部响应消息
        data:
          type: object
          description: 备份详情
          properties:
            name:
              type: string
              description: 备份名称
            id:
              type: string
              description: 备份 ID
    SnapshotCreateResultData:
      type: object
      description: 快照创建结果
      properties:
        code:
          type: integer
          description: 内部状态码，200 表示成功
        msg:
          type: string
          description: 内部响应消息
        data:
          type: object
          description: 快照详情
          properties:
            name:
              type: string
              description: 快照名称
            id:
              type: string
              description: 快照 ID
    BackupListData:
      type: array
      description: 备份列表
      items:
        type: object
        properties:
          id:
            type: integer
            description: 备份 ID
          virtuals_id:
            type: integer
            description: VPS ID
          name:
            type: string
            description: 备份名称
          state:
            type: integer
            description: 备份状态
          created_at:
            type: string
            format: date-time
            description: 创建时间
    SnapshotListData:
      type: array
      description: 快照列表
      items:
        type: object
        properties:
          id:
            type: integer
            description: 快照 ID
          virtuals_id:
            type: integer
            description: VPS ID
          name:
            type: string
            description: 快照名称
          state:
            type: integer
            description: 快照状态
          created_at:
            type: string
            format: date-time
            description: 创建时间
    CreateHostQuery:
      type: object
      required:
        - line_id
        - os
        - cpu
        - memory
        - hard_disks
        - bandwidth
        - expire_time
      properties:
        line_id:
          type: integer
          description: 线路 ID
        nodes_id:
          type: integer
          description: 物理节点 ID（可选）
        users_id:
          type: integer
          description: 用户 ID（可选）
        os:
          type: string
          description: 操作系统模板名称
        cpu:
          type: integer
          description: CPU 核数
        memory:
          type: integer
          description: 内存大小 (GB)
        hard_disks:
          type: integer
          description: 硬盘大小 (GB)
        bandwidth:
          type: integer
          description: 带宽 (Mbps)
        snapshot:
          type: integer
          description: 快照数量（可选）
        backups:
          type: integer
          description: 备份数量（可选）
        sys_pwd:
          type: string
          description: 系统盘密码（可选）
        vnc_pwd:
          type: string
          description: VNC 密码（可选）
        max_reinstall_num:
          type: integer
          description: 最大重装次数（可选）
        expire_time:
          type: string
          format: date-time
          description: '到期时间 (YYYY-MM-DD HH:mm:ss)。F2：必须为未来且不晚于 now + web.cloud_max_extend_days（默认 730 天）。'
        ipnum:
          type: integer
          description: 分配的额外 IP 数量（可选）
        traffic:
          type: integer
          description: 流量额度（可选）
        port_num:
          type: integer
          description: 端口数量（可选）
        host_name:
          type: string
          description: 主机名（可选）
    ElasticUpdateQuery:
      type: object
      required:
        - host_id
      properties:
        host_id:
          type: integer
          description: VPS 的 ID
        order_id:
          type: string
          description: 已支付订单授权号（P2-11 必填；单次消费、绑定主机与租户）
        cpu:
          type: integer
          description: CPU 核数（可选）
        memory:
          type: integer
          description: 内存大小 (GB，可选)
        hard_disks:
          type: integer
          description: 硬盘大小 (GB，可选)
        bandwidth:
          type: integer
          description: 带宽 (Mbps，可选)
        backups:
          type: integer
          description: 备份数量（可选）
        port_num:
          type: integer
          description: 端口数量（可选）
        snapshot:
          type: integer
          description: 快照数量（可选）
    SecurityAclAddQuery:
      type: object
      properties:
        hostid:
          type: integer
          description: 所属 VPS 的 ID
        host_id:
          type: integer
          description: hostid 的别名（控制器自动归一化为 hostid）
        direction:
          type: string
          description: 流量方向（in/out，兼容 1/2/ingress/egress）
        protocol:
          type: string
          description: 协议类型（TCP、UDP、ICMP、ANY 等）
        method:
          type: string
          description: 处理方式（accept、drop，兼容 allow/deny/reject）
        port:
          type: string
          description: 端口号（可为空，默认 -1 表示任意）
        ip:
          type: string
          description: 源/目标 IP 地址（可为空，默认 0.0.0.0）
        start_port:
          type: string
          description: port 的别名（控制器自动归一化为 port）
        start_ip:
          type: string
          description: ip 的别名（控制器自动归一化为 ip）
        orientation:
          type: string
          description: direction 的别名（控制器自动归一化为 direction）
        tactics:
          type: string
          description: method 的别名（'1' 表示 drop，其余表示 accept）
        priority:
          type: integer
          description: 规则优先级（可选，默认 100）
    OpenHostQuery:
      type: object
      properties:
        productid:
          type: integer
          description: 产品 ID
        templates_id:
          type: integer
          description: 模板 ID
        sys_pwd:
          type: string
          description: 系统密码
        vnc_pwd:
          type: string
          description: VNC 密码
        expire_time:
          type: string
          format: date-time
          description: '到期时间。F2：必须为未来且不晚于 now + web.cloud_max_extend_days（默认 730 天）。'
        line_id:
          type: integer
          description: 线路 ID
    AddPortHostQuery:
      type: object
      properties:
        host_id:
          type: integer
          description: VPS 的 ID
        name:
          type: string
          description: 端口映射名称
        sport:
          type: string
          nullable: true
          description: 源端口，可为空（自动分配）
        dport:
