  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: apikey
      in: header
      description: >-
        请求头中携带的 API Key。凭据在 config/web.php 的 `cloud_credentials`
        中按租户/调用方配置（只存 `hash_hmac('sha256', key, id)` 散列，不存明文），
        每个凭据可单独撤销并限定作用域（read / host_control / order /
        credentials / all，或显式 action 列表）。未配置 `cloud_credentials`
        时兼容旧的单一 `web.apikey`（无作用域，不能访问 hostinfo_credentials）。
